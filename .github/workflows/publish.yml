name: publish

# Publishes on a version tag, over npm trusted publishing (OIDC). There is no
# token in this repo and none should be created: a long-lived credential in CI
# is the thing provenance exists to avoid.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # required for OIDC and for the provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          # npm recommends disabling the dependency cache for release builds.
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1+, and the runner's bundled npm can be
      # older than that even on current Node.
      - name: Ensure a recent npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dev dependencies
        run: npm ci

      - name: Guard the tag against package.json
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag does not match package.json $manifest" >&2
            exit 1
          fi
          echo "publishing $manifest"

      # The suite is also prepublishOnly, but running it as its own step means a
      # failure reads as a test failure rather than a publish failure.
      - name: Test
        run: npm test

      # No NODE_AUTH_TOKEN: trusted publishing authenticates over OIDC.
      # --provenance is passed explicitly rather than relying on trusted
      # publishing's automatic attestation, which has been reported not to fire
      # in every case. It is a no-op when the attestation is already generated.
      - name: Publish
        run: npm publish --access public --provenance

      # Informational only. Registry propagation lags a minute or more after a
      # publish, so a failure here means "not visible yet", not "bad release" —
      # and a red run after a good publish trains everyone to ignore red runs.
      - name: Verify the attestation
        continue-on-error: true
        run: npm audit signatures
